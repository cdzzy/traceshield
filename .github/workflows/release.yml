name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi
          echo "Tag ${TAG_VERSION} matches package.json version."

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Create npm package tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Guard: only publish from the canonical repository on a v* tag push.
    if: >-
      github.repository == 'cdzzy/traceshield' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write # for npm provenance
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: .

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm credentials are configured (secret guard)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured in repository settings."
            echo "Add it under Settings > Secrets and variables > Actions to enable publishing."
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance *.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
